- slug: simulacrum-v2
  featured: true
  title: Synthetic cancer data that lets researchers work without touching a patient record
  name: Simulacrum v2
  partner: National Disease Registration Service, NHS England
  partner_short: NHS England NDRS
  partner_logos: [NHS England, NDRS]
  primary_service: data-and-analytics
  secondary_services: [technology-and-solutions]
  status: Live and in use
  running_since: 2018 — v2 released 2023
  funded_by: NHS England
  image_label: Synthetic data
  keywords:
    - { label: Data & Analytics, slug: data-and-analytics, facet: service }
    - { label: Synthetic data, slug: synthetic-data, facet: method }
    - { label: Cancer, slug: cancer, facet: subject }
    - { label: Data privacy, slug: data-privacy, facet: method }
    - { label: Real-world evidence, slug: real-world-evidence, facet: method }
    - { label: Dataset, slug: dataset, facet: output }
  summary: Simulacrum v2 is a collection of synthetic datasets built from confidential cancer patient data held by the National Disease Registration Service at NHS England — realistic enough to design a study against, with no real patient in it.
  challenge: Getting approval to work with real cancer patient data takes months. Researchers were designing studies blind — not knowing whether the data could answer their question until they had already committed to it.
  challenge_detail: The cancer registry holds around a thousand data items per patient. Nobody outside it could see the shape of that data, so proposals were written on assumption, applications failed late, and good research questions were abandoned for the wrong reasons.
  research:
    intro: Synthetic data is only useful if it behaves like the real thing, and only safe if it cannot be traced back to anyone. Those two goals pull against each other, and where you set the balance is a judgement, not a formula.
    methods:
      - Records generated from the statistical distribution of the national cancer dataset, not by copying rows.
      - Re-identification risk tested against known attack models before release.
      - Fidelity measured against the real distribution for the variables researchers actually use.
      - Approach reviewed and approved under the NDRS partnership agreement.
  solution: We built a synthetic twin of the national cancer dataset, then expanded it so it covers the treatment pathway, not just the diagnosis.
  solution_points:
    - title: More recent diagnoses
      body: v2 extends beyond the original cohort so studies are designed against data that reflects current practice.
    - title: A richer treatment picture
      body: Chemotherapy, radiotherapy and molecular diagnostic testing, so pathway questions can be asked and not just incidence ones.
    - title: Free and open to use
      body: Available under an open licence, without an application to hold patient data.
    - title: Built to be checked
      body: Documentation, a data dictionary and the method published alongside the files.
  impact:
    - title: For researchers
      value: 200+
      description: research groups have used the Simulacrum to design or test a study before applying for real data.
    - title: For patients
      value: Zero
      description: real patient records leave the registry. Research starts without anyone's confidentiality being at stake.
    - title: For the system
      value: 6 months
      description: cut from the time between a research question and a defensible answer.
  quote:
    text: It meant we could design the study against data that behaved like the registry, without waiting half a year to find out we had asked the wrong question.
    attribution: Programme lead, National Disease Registration Service
  partner_blurb: Part of NHS England. HDI holds a formal partnership agreement with NDRS.
  tech:
    - Ruby
    - PostgreSQL
    - R
    - Trusted research environment
    - Statistical disclosure control
  timeline:
    - { dates: 2016–2018, name: 'Phase 1 — original Simulacrum', caption: 'First synthetic release covering diagnosis.' }
    - { dates: 2019–2022, name: 'Phase 2 — treatment data', caption: 'Chemotherapy, radiotherapy and molecular testing added.' }
    - { dates: '2023 · open now', name: 'Phase 3 — Simulacrum v2', caption: 'Extended cohort, current practice, open licence.', current: true }
    - { dates: 2026–, name: 'Phase 4 — further disease areas', caption: 'The same approach, outside cancer.' }
  outputs:
    - { title: Download the dataset, detail: CSV · ~1.2 GB · Open Government Licence, icon: arrow-up-on-square, href: 'https://simulacrum.healthdatainsight.org.uk' }
    - { title: Data dictionary and documentation, detail: Variables, methods and known limitations, icon: document-text, href: 'https://simulacrum.healthdatainsight.org.uk' }
    - { title: Synthetic data demonstrates major benefits for cancer research, detail: 'Peer-reviewed publication · BMJ, 2024', icon: document-duplicate, href: '#' }
    - { title: Project website, detail: simulacrum.healthdatainsight.org.uk, icon: inbox-stack, href: 'https://simulacrum.healthdatainsight.org.uk' }
  related: [cas-explorer, real-world-standing-cohorts, brain-tumour-data-dashboard]
