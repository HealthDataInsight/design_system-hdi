  summary: A public dashboard that takes national brain tumour statistics and presents them so patients and families can find a number they recognise.
  challenge: National brain tumour statistics existed, but not in a form a patient could use.
  solution: A public dashboard designed with brainstrust, sitting on top of the national registration data.
  impact:
